<!DOCTYPE html>
<html>
<head>
  <title>Spam Shield Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f3f4f6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #1f2937; }
    .instructions {
      background: #dbeafe;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    canvas {
      border: 2px solid #e5e7eb;
      margin: 10px;
      border-radius: 4px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin: 5px;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ Spam Shield Icon Generator</h1>
    
    <div class="instructions">
      <p><strong>Instructions:</strong></p>
      <ol>
        <li>Click "Generate Icons" below</li>
        <li>Right-click each canvas and save as PNG</li>
        <li>Save them in the <code>extension/assets/icons/</code> folder with these names:
          <ul>
            <li>icon16.png</li>
            <li>icon32.png</li>
            <li>icon48.png</li>
            <li>icon128.png</li>
          </ul>
        </li>
      </ol>
    </div>

    <button onclick="generateAllIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All</button>

    <div id="iconContainer"></div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3b82f6');
      gradient.addColorStop(1, '#2563eb');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Shield shape
      ctx.fillStyle = 'white';
      ctx.beginPath();
      const centerX = size / 2;
      const centerY = size / 2;
      const shieldWidth = size * 0.6;
      const shieldHeight = size * 0.7;
      
      // Draw shield outline
      ctx.moveTo(centerX, centerY - shieldHeight/2);
      ctx.lineTo(centerX + shieldWidth/2, centerY - shieldHeight/3);
      ctx.lineTo(centerX + shieldWidth/2, centerY + shieldHeight/4);
      ctx.lineTo(centerX, centerY + shieldHeight/2);
      ctx.lineTo(centerX - shieldWidth/2, centerY + shieldHeight/4);
      ctx.lineTo(centerX - shieldWidth/2, centerY - shieldHeight/3);
      ctx.closePath();
      ctx.fill();
      
      // Checkmark
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      ctx.beginPath();
      ctx.moveTo(centerX - size * 0.15, centerY);
      ctx.lineTo(centerX - size * 0.05, centerY + size * 0.12);
      ctx.lineTo(centerX + size * 0.2, centerY - size * 0.15);
      ctx.stroke();
      
      // Add text for larger icons
      if (size >= 48) {
        ctx.fillStyle = '#1e40af';
        ctx.font = `bold ${size * 0.08}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('SPAM', centerX, size - size * 0.1);
      }
    }

    function generateAllIcons() {
      const container = document.getElementById('iconContainer');
      container.innerHTML = '';
      
      const sizes = [16, 32, 48, 128];
      
      sizes.forEach(size => {
        const wrapper = document.createElement('div');
        wrapper.style.display = 'inline-block';
        wrapper.style.margin = '10px';
        wrapper.style.textAlign = 'center';
        
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.id = `icon${size}`;
        
        const label = document.createElement('p');
        label.textContent = `${size}x${size}px - icon${size}.png`;
        label.style.fontSize = '12px';
        label.style.color = '#6b7280';
        
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Download';
        downloadBtn.style.fontSize = '11px';
        downloadBtn.style.padding = '6px 12px';
        downloadBtn.onclick = () => downloadIcon(canvas, `icon${size}.png`);
        
        drawIcon(canvas, size);
        
        wrapper.appendChild(canvas);
        wrapper.appendChild(label);
        wrapper.appendChild(downloadBtn);
        container.appendChild(wrapper);
      });
    }

    function downloadIcon(canvas, filename) {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function downloadAll() {
      const sizes = [16, 32, 48, 128];
      sizes.forEach((size, index) => {
        setTimeout(() => {
          const canvas = document.getElementById(`icon${size}`);
          if (canvas) {
            downloadIcon(canvas, `icon${size}.png`);
          }
        }, index * 500); // Stagger downloads
      });
    }

    // Auto-generate on load
    window.onload = generateAllIcons;
  </script>
</body>
</html>
